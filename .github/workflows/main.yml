name: Build Onushilon Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare & Build Release APK
        run: |
          if [ -f "onushilon_flutter_app/pubspec.yaml" ]; then
            cd onushilon_flutter_app
          fi
          python3 -c 'import glob; [open(f,"w").write(open(f).read().replace("replaceAll(\x27$$\x27, \x27\x27).replaceAll(\x27$\x27, \x27\x27)", "replaceAll(r\x27$$\x27, \x27\x27).replaceAll(r\x27$\x27, \x27\x27)").replace("Icons.Adjust_rounded", "Icons.adjust_rounded")) for f in glob.glob("lib/**/*.dart", recursive=True)]'
          rm -rf android ios web linux macos windows test
          flutter create . --project-name onushilon --org com.onushilon
          python3 -c 'p="android/app/src/main/AndroidManifest.xml"; s=open(p).read(); s=s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n    <application", 1) if "android.permission.INTERNET" not in s else s; s=s.replace("android:label=\"onushilon\"", "android:label=\"অনুশীলন\""); open(p,"w").write(s)'
          flutter pub get
          dart run flutter_launcher_icons || true
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/apk_out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/apk_out/Onushilon-v1.0.0.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Onushilon-Release-APK
          path: apk_out/Onushilon-v1.0.0.apk
